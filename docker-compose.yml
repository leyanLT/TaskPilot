name: taskpilot

services:
  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////data/taskpilot.db
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-30}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-1}
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT:-10}
      PENDING_ACTION_TTL_MINUTES: ${PENDING_ACTION_TTL_MINUTES:-30}
    volumes:
      - taskpilot-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  taskpilot-data:
